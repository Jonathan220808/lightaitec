<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心灵奇旅</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #FFF8F2;
      --card:    #FFFFFF;
      --accent:  #5E8CB5;
      --accent-lt: rgba(94,140,181,.12);
      --text:    #1A1108;
      --muted:   #9A8070;
      --soft:    #EDE8E2;
      --ease:    cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background:
        radial-gradient(ellipse 100% 55% at 50% 0%, rgba(94,140,181,.1) 0%, transparent 65%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 80px;
      color: var(--text);
    }

    /* ── 顶部导航 ── */
    .nav {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 0;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: .06em;
      transition: color .2s;
    }
    .back:hover { color: var(--accent); }
    .game-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── 主体 ── */
    .wrap {
      width: 100%;
      max-width: 600px;
      margin-top: 52px;
    }

    /* ── 标题 ── */
    .heading {
      text-align: center;
      margin-bottom: 44px;
    }
    .heading h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -.01em;
      color: var(--text);
      margin-bottom: 10px;
    }
    .heading p {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    /* ── 难度选择 ── */
    .depth-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .depth-btn {
      padding: 8px 22px;
      border: 1.5px solid var(--soft);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--muted);
      background: var(--card);
      cursor: pointer;
      font-family: inherit;
      transition: all .22s var(--ease);
    }
    .depth-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .depth-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px rgba(94,140,181,.3);
    }

    /* ── 问题卡 ── */
    .question-card {
      background: var(--card);
      border-radius: 28px;
      box-shadow:
        0 2px 0 rgba(94,140,181,.08),
        0 12px 48px rgba(0,0,0,.08),
        0 2px 8px rgba(0,0,0,.04);
      padding: 0;
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* 顶部蓝色区 */
    .card-top {
      background: linear-gradient(135deg, var(--accent) 0%, #7AAECC 100%);
      height: 8px;
    }

    /* 卡片主体 */
    .card-body {
      padding: 56px 52px 52px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }

    /* 顶部左侧装饰竖线 */
    .card-body::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      border-radius: 0 0 3px 3px;
      opacity: .35;
    }

    .question-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 2.15;
      color: var(--text);
      position: relative;
      z-index: 1;
      animation: qIn .5s var(--ease) both;
    }
    .question-text.placeholder {
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .04em;
      line-height: 2;
      animation: none;
    }

    @keyframes qIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 进度条 ── */
    .progress {
      margin-top: 32px;
      text-align: center;
    }
    .progress-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .progress-dots {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--soft);
      transition: background .3s;
    }
    .dot.used { background: var(--accent); opacity: .5; }
    .dot.current { background: var(--accent); opacity: 1; }

    @media (max-width: 480px) {
      body { padding: 0 16px 60px; }
      .heading h1 { font-size: 34px; }
      .card-body { padding: 44px 28px 40px; min-height: 200px; }
      .question-text { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <a class="back" href="../">← 返回</a>
    <span class="game-label">关系游戏 · 01</span>
  </div>

  <div class="wrap">
    <div class="heading">
      <h1>心灵奇旅</h1>
      <p>从轻松到深入，让对话自然流动</p>
    </div>

    <div class="depth-row">
      <button class="depth-btn" onclick="getQuestion('easy', this)">轻松题</button>
      <button class="depth-btn" onclick="getQuestion('middle', this)">深入题</button>
      <button class="depth-btn" onclick="getQuestion('hard', this)">走心题</button>
    </div>

    <div class="question-card">
      <div class="card-top"></div>
      <div class="card-body">
        <div class="question-text placeholder" id="showQ">点击抽题，再点换题</div>
      </div>
    </div>
  </div>

  <script>

        "如果你的生活最近是一部电影，它会是什么类型？",
        "如果用一种动物形容现在的你，你会选什么？",

      ],
      middle: [
        "你最近最想理清楚的一件事是什么？",

        "你最容易用什么事情，来回避真正重要的事情？",
        "有没有一个问题，你总觉得再等等会更好处理，结果一直没有处理？",

        "有没有一种生活，是你嘴上说不想要，心里却偶尔会羡慕的？",

        "哪一次选择，让你第一次意识到自己真正重视什么？",
        "你做重要决定时，最害怕辜负的是自己，还是别人？",
        "你有没有一种状态，以为自己克服了，后来发现它其实还在？",
        "哪一种成长，是你付出很大代价才获得的？",
        "你现在正在练习成为一个怎样的人？",
        "你觉得自己最矛盾的一个特点是什么？",
        "你在哪一种环境里，最容易发挥出自己最好的一面？",
        "你是什么时候开始真正意识到，自己和别人不太一样的？",

        "你觉得自己有哪些价值，是不需要靠成绩或表现来证明的？",
        "当你没有达到期待时，你通常会怎样看待自己？",
        "有没有一个遗憾，后来反而帮助你看清了自己？",

        "你觉得自己在关系里最需要学习的能力是什么？",
        "你觉得为别人着想，什么时候会变成委屈自己？",
        "你会如何判断一段关系值得继续投入，还是应该慢慢退出？",
        "对你来说，关系中的自由意味着什么？",
        "你觉得喜欢一个人和适合与一个人在一起，最大的区别是什么？",
        "在亲密关系里，心动和安心哪个对你更重要？",
        "你认为爱一个人，需要在多大程度上为对方改变？",
        "一段好的关系，应该让两个人更依赖彼此，还是更有能力成为自己？",
        "你觉得爱最容易在哪一种情况下慢慢消失？",
        "你的家庭最深地影响了你对哪件事情的看法？",
        "有没有一种家庭里的相处方式，是你希望自己以后不要重复的？",
        "你从家人身上继承了什么自己很珍惜的部分？",
        "如果未来只能做好少数几件事，你最希望是哪几件？",
        "你觉得什么样的人生，才算没有辜负自己？",
        "如果所有外在标准都暂时消失，你会怎样重新安排自己的生活？"
      ],
      hard: [
        "你有没有一种情绪，很少在别人面前表达，但其实经常出现？",
        "当你心里很难受时，你通常希望别人发现，还是希望没人打扰？",
        "有没有一次，你直到很久以后才意识到，自己当时其实受伤了？",

        "你有没有一个人，知道很难再联系了，但偶尔还是会想起？",

        "一个人做什么，会让你慢慢愿意把真实的自己交给他看？",
        "你真正信任一个人以后，会出现哪些和平时不同的表现？",

        "你现在处理关系的方式，有哪些是从家里不知不觉学来的？",
        "有没有一种来自家庭的影响，是你现在很想重新改写的？",

        "你有没有因为太在乎一段关系，反而把它抓得太紧？",
        "对你来说，更难承受的是一个人离开，还是一个人留下却不再靠近？",
        "有没有一件事，你已经不再责怪别人，却仍然没有完全释怀？",
        "你有没有一个遗憾，并不想改变结果，只希望当时的自己能被理解？",
        "对你来说，原谅一个人意味着重新靠近，还是只是放过自己？",
        "有没有一段经历，让你从那以后再也不是原来的自己？",
        "你人生中哪一个决定，表面上改变了一件事，实际上改变了你整个人？",
        "有没有一次失去，后来反而让你更清楚自己真正重视什么？",
        "当你说“我没事”的时候，你心里真正希望别人做什么？",
        "如果不担心给别人添麻烦，你最想向身边的人提出什么需要？",
        "你最希望被怎样坚定地选择一次？",
        "你希望未来重要的人，能够和你一起守护什么？",
        "你希望一段长久的关系，最终把你变成一个怎样的人？",
        "如果未来有一个人陪你走很久，你最希望你们之间一直保留什么？"
      ]
    };

    let usedIndex = { easy: [], middle: [], hard: [] };

    function getQuestion(type, btn) {
      document.querySelectorAll('.depth-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const el = document.getElementById('showQ');
      const list = questionList[type];
      const used = usedIndex[type];
      let avail = list.map((_, i) => i).filter(i => !used.includes(i));

      if (avail.length === 0) {
        used.length = 0;
        avail = list.map((_, i) => i);
      }

      const idx = avail[Math.floor(Math.random() * avail.length)];
      used.push(idx);

      triggerAnim(el);
      el.className = 'question-text';
      el.innerText = list[idx];
    }

    function triggerAnim(el) {
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = '';
    }
  </script>
</body>
</html>
